<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#151d2f" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.12)" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />
  <circle cx="200" cy="120" r="110" fill="url(#glow)" />

  <!-- Outer Architectural Plate Border -->
  <rect x="16" y="16" width="368" height="268" rx="8" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5" stroke-dasharray="4 2" />
  <rect x="22" y="22" width="356" height="256" rx="6" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

  <!-- Corner Brackets -->
  <path d="M 26 36 L 26 26 L 36 26" fill="none" stroke="#38bdf8" stroke-width="2" />
  <path d="M 374 36 L 374 26 L 364 26" fill="none" stroke="#38bdf8" stroke-width="2" />
  <path d="M 26 264 L 26 274 L 36 274" fill="none" stroke="#38bdf8" stroke-width="2" />
  <path d="M 374 264 L 374 274 L 364 274" fill="none" stroke="#38bdf8" stroke-width="2" />

  <!-- Iconic CRT / Cartridge Silhouette -->
  <g transform="translate(160, 70)" stroke="#38bdf8" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Monitor Bezel -->
    <rect x="0" y="0" width="80" height="60" rx="6" stroke="rgba(56, 189, 248, 0.8)" fill="rgba(15, 23, 42, 0.9)" />
    <!-- Screen Glass -->
    <rect x="8" y="7" width="64" height="46" rx="3" stroke="rgba(56, 189, 248, 0.4)" fill="rgba(56, 189, 248, 0.05)" />
    <!-- Pixel Gamepad Icon Inside Screen -->
    <path d="M 24 30 L 36 30 M 30 24 L 30 36 M 46 27 A 1.5 1.5 0 0 1 49 27 M 53 33 A 1.5 1.5 0 0 1 56 33" stroke="#38bdf8" stroke-width="2" />
    <!-- Monitor Stand -->
    <path d="M 32 60 L 32 68 L 24 72 L 56 72 L 48 68 L 48 60" stroke="rgba(56, 189, 248, 0.6)" fill="rgba(15, 23, 42, 0.9)" />
  </g>

  <!-- Museum Badge & Typography -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect x="110" y="166" width="180" height="22" rx="11" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
    <text x="200" y="181" fill="#38bdf8" font-size="10" font-weight="700" letter-spacing="1.5">MUSEUM ACCESSION</text>
    
    <text x="200" y="214" fill="#f8fafc" font-size="13" font-weight="600" letter-spacing="0.5">ARCHIVAL EXHIBIT RECORD</text>
    <text x="200" y="234" fill="#94a3b8" font-size="10" letter-spacing="0.2">Primary Digitization Cataloguing in Progress</text>
    
    <text x="200" y="258" fill="#64748b" font-size="8.5" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" letter-spacing="1">NOSTALGICVERSE CURATORIAL PRESERVATION</text>
  </g>
</svg>

